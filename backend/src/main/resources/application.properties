spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/food-delivery}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Hibernate creates tables from entities, Flyway adds data.
# When validate is used, Hibernate will validate the schema against the entities and throw an exception if there are discrepancies. This ensures that the database schema is in sync with the JPA entities without allowing Hibernate to modify the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable ANSI color output in the console. 
spring.output.ansi.enabled=ALWAYS

# SQL Initialisation (only for initial data seeding).
# Set to 'never' to disable. @PostConstruct still can be used for data seeding.
spring.sql.init.mode=never

# Activates Flyway.
spring.flyway.enabled=true
# With an existing database, this setting allows Flyway to start managing the schema without trying to re-apply existing migrations.
spring.flyway.baseline-on-migrate=true
# In case multiple Versioned migrations are present, this setting defines the version to which the existing schema should be baselined.
#spring.flyway.baseline-version=0

spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/food-delivery
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate creates tables from entities, Flyway adds data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable ANSI color output in the console. 
spring.output.ansi.enabled=ALWAYS

# SQL Initialisation (only for initial data seeding).
# Set to 'never' to disable. @PostConstruct still can be used for data seeding.
spring.sql.init.mode=never

# Activates Flyway.
spring.flyway.enabled=true
# With an existing database, this setting allows Flyway to start managing the schema without trying to re-apply existing migrations.
spring.flyway.baseline-on-migrate=true

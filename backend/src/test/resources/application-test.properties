# Bei deinem aktuellen Integrationstest mit MockMvc brauchst du normalerweise keinen eigenen Server-Port. MockMvc schickt keine echte HTTP-Anfrage über localhost:8080, sondern testet intern gegen den Spring-Webkontext.

spring.datasource.url=jdbc:postgresql://localhost:5432/food-delivery-test
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
<div class="navbar-container">
  <div class="icon" [routerLink]="'/'" routerLinkActive="selected">
    <img src="assets/favicon.png" tabindex="0" />
  </div>

  <div class="nav-buttons">
    <button
      matButton="filled"
      (click)="onGetAllRestaurants()"
      [routerLink]="'/allRestaurants'"
      aria-label="Show all restaurant names."
      routerLinkActive="selected"
    >
      Show all Restaurants
    </button>

    @if (authService.authUser() !== undefined) {
      <button matButton="filled" [routerLink]="'/cart'" routerLinkActive="selected" title="Basket">
        <mat-icon>shopping_cart</mat-icon>
      </button>

      <button matButton="filled" [routerLink]="'/account'" routerLinkActive="selected" title="Account">
        <mat-icon>account_box</mat-icon>
      </button>

      <button matButton="filled" [routerLink]="'/logout'" routerLinkActive="selected" (click)="onLogout()">Logout</button>
    } @else {
      <button matButton="filled" [routerLink]="'/login'" routerLinkActive="selected">Login</button>
      <button matButton="filled" [routerLink]="'/register'" routerLinkActive="selected">Register</button>
    }
  </div>
</div>

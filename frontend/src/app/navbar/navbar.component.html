<div class="navbar-container">

    <div class="icon" [routerLink]="'/'" routerLinkActive="selected">
        <img src="assets/favicon.png" tabindex="0">
    </div>

    <div class="nav-buttons">
        <button matButton="filled" (click)="onGetAllRestaurants()" [routerLink]="'/allRestaurants'"
            aria-label="Show all restaurant names." routerLinkActive="selected">Show all
            Restaurants
        </button>

        <button matButton="filled" [routerLink]="'/account'" routerLinkActive="selected" title="Account"
            aria-label="Account button with an icon.">
            <mat-icon>account_box</mat-icon>
        </button>
        <button matButton="filled" [routerLink]="'/cart'" routerLinkActive="selected" title="Basket"
            aria-label="Basket button with an icon.">
            <mat-icon>shopping_cart</mat-icon>
        </button>

        <button matButton="filled" [routerLink]="'/login'" routerLinkActive="selected">Login</button>
        <button matButton="filled" [routerLink]="'/logout'" routerLinkActive="selected">Logout</button>
    </div>
</div>

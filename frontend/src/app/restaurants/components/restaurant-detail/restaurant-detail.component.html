<div class="restaurants-detail-container">
  <div class="restaurant-details">
    <div class="restaurant-details-image">
      <img [src]="'/images/restaurants/' + getCurrentRestaurantImage()" />
    </div>
    <div class="restaurant-details-information">
      <p>{{ getCurrentCategory() }}</p>
      <h2>{{ getCurrentRestaurant() }}</h2>
    </div>
  </div>

  <div class="menu-item-container">
    @for (m of menuItems(); track m.id) {
      <div class="menu-item">
        <div class="menu-item-menu">
          <div class="menu-item-details">
            <p>{{ m.foodName }}</p>
            <p>Price: {{ m.price }} Euro</p>
          </div>
          <div class="menu-item-image">
            <img [src]="'/images/menus/' + m.foodImage" />
          </div>
          <div class="menu-item-favourite">
            <button class="favourite-button" mat-icon-button (click)="onRemoveFromFavourites(m.id)" tabIndex="0">
              <mat-icon>favorite</mat-icon>
            </button>
          </div>
        </div>
        <div class="quantity-control">
          <button
            class="remove-button"
            (click)="onRemoveFromCart(m.id)"
            aria-hidden="false"
            aria-label="Remove item from cart."
            tabindex="0"
          >
            <mat-icon mat-icon-button fontIcon="remove"></mat-icon>
          </button>
          <p class="item-quantity">{{ getItemQuantity(m.id) }}</p>
          <button class="add-button" (click)="onAddToCart(m.id)" aria-hidden="false" aria-label="Add item to cart." tabindex="0">
            <mat-icon mat-icon-button fontIcon="add"></mat-icon>
          </button>
        </div>
      </div>
    }
  </div>
</div>

<div class="restaurants-detail-container">
    <div class="restaurant-details">
        <h2>{{getCurrentRestaurant()}}</h2>
        <img [src]="'/images/restaurants/' + getCurrentRestaurantImage()">
    </div>

    <div class="menu-item-container">
        @for(m of menuItems(); track m.id){
        <div class="menu-item">
            <img [src]="'/images/menus/' + m.foodImage">
            <p>{{m.foodName}}</p>
        </div>
        }
    </div>
</div>

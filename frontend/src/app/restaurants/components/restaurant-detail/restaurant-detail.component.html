<div class="restaurants-detail-container">
    <div class="restaurant-details">
        <div class="restaurant-details-image">
            <img [src]="'/images/restaurants/' + getCurrentRestaurantImage()">
        </div>
        <div class="restaurant-details-information">
            <p>{{getCurrentCategory()}}</p>
            <h2>{{getCurrentRestaurant()}}</h2>
        </div>
    </div>

    <div class="menu-item-container">
        @for(m of menuItems(); track m.id){
        <div class="menu-item">

            <div class="menu-item-menu">
                <div class="menu-item-details">
                    <p>{{m.foodName}}</p>
                    <p>Price: {{m.price}} Euro</p>
                </div>
                <div class="menu-item-image">
                    <img [src]="'/images/menus/' + m.foodImage">
                </div>
            </div>
            <div class="mat-icon">
                <mat-icon aria-hidden="false" aria-label="Remove item from cart." fontIcon="remove"
                    (click)="onRemoveFromCart()"></mat-icon>
                <mat-icon aria-hidden="false" aria-label="Add item to cart." fontIcon="add"
                    (click)="onAddToCart()"></mat-icon>
            </div>

        </div>
        }
    </div>
</div>

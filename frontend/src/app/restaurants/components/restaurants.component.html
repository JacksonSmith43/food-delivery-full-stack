<div class="food-category-container">
    <!-- <p>Category</p> -->
    @for (i of categories(); track $index) {
    <div class="categories-container" (click)="onCategoryClick(i)">
        {{i}}
    </div>
    }

</div>

<div class="all-restaurants-container">
    @for(i of restaurants(); track i.id){

    <div class="restaurant-container">
        <!-- With the img, link and script tag one can implicitly make a request to the server. -->
        <img [src]="'/images/restaurants/' + i.imageName">
        <p>{{i.id}}</p>
        <p>{{i.restaurantName}}</p>
        <p>{{i.category}}</p>
        <p>{{i.plz}}</p>
    </div>
    }
</div>

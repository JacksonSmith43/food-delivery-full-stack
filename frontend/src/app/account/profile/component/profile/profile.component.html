<div class="profile-container">
  @if (authService.authUser() !== undefined) {
    <h2>Profile</h2>

    <div
      class="email-container credentials"
      (keydown.enter)="this.accountService.openDialog('email')"
      (click)="this.accountService.openDialog('email')"
      tabindex="0"
      title="Click to change your email address."
    >
      <label for="email">Email address</label>
      <button id="email" mat-raised-button aria-label="Email address.">
        {{ this.authService.authUser()?.email }}
      </button>
    </div>

    <div
      class="password-container credentials"
      (keydown.enter)="this.accountService.openDialog('password')"
      (click)="this.accountService.openDialog('password')"
      tabindex="0"
      title="Click to change your password."
    >
      <label for="password">Password</label>
      <div class="password-button-container">
        @for (i of getPasswordLength(); track $index) {
          <button id="password" mat-raised-button aria-label="Masked Password.">*</button>
        }
      </div>
    </div>

    <div
      class="phone-number-container credentials"
      (keydown.enter)="this.accountService.openDialog('phoneNumber')"
      (click)="this.accountService.openDialog('phoneNumber')"
      tabindex="0"
      title="Click to change your phone number."
    >
      <label for="phone-number">Phone number</label>
      <button id="phone-number" mat-raised-button aria-label="Phone number.">
        {{ currentUserProfile()?.phoneNumber }}
      </button>
    </div>
  } @else {
    <h2 class="login-warning">Login to see your account details.</h2>
  }
</div>
